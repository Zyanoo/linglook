name: Build Chrome Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package extension
        run: |
          cd dist
          zip -r ../linglook-chrome-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linglook-chrome-extension
          path: linglook-chrome-extension.zip
